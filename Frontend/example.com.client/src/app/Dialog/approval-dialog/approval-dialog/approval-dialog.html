@if (visible()){

  <div
    class="modal fade show d-block"
    tabindex="-1"
    role="dialog"
    aria-modal="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">
            @if(approve()){
              Approve Request
            } @else {
              Reject Request
            }
          </h5>

          <button
            type="button"
            class="btn-close"
            (click)="close()">
          </button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">
              รายการ
            </label>
            <ul>
            @for (item of selectedApproval(); track item.id) {
              <li>{{item.name}}</li>

            }
            </ul>

          <div class="mb-3">
            <label class="form-label">
              เหตุผล
            </label>

            <textarea
              class="form-control"
              rows="3"
              [(ngModel)]="reason"
            >
            </textarea>
          </div>

        </div>

        <div class="modal-footer">

          @if(isSubmitting()){
            <button
              type="button"
              class="btn btn-secondary"
              disabled>
             <span
               class="spinner-border spinner-border-sm me-2">
              </span>  Submitting...
            </button>
          } @else {
            <button
              type="button"
              class="btn btn-secondary"
              (click)="close()">
              Close
            </button>

            <button
              type="button"
              class="btn btn-primary"
              (click)="submit()" >
              Confirm
            </button>
          }


        </div>

      </div>

    </div>
    </div>
  </div>

  <div class="modal-backdrop fade show"></div>
}
