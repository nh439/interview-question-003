@if (visible()) {

  <div
    class="modal fade show d-block"
    tabindex="-1"
    role="dialog"
    aria-modal="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">
            เพิ่มรายการ
          </h5>

          <button
            type="button"
            class="btn-close"
            (click)="close()">
          </button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">
              รายการ
            </label>

            <input
              type="text"
              class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">
              เหตุผล
            </label>

            <textarea
              class="form-control"
              rows="3">
            </textarea>
          </div>

        </div>

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            (click)="close()">
            ยกเลิก
          </button>

          <button
            type="button"
            class="btn btn-primary">
            บันทึก
          </button>

        </div>

      </div>

    </div>

  </div>

  <div class="modal-backdrop fade show"></div>

}
